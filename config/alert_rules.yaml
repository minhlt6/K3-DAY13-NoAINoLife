alerts:
  - name: high_latency_p95
    severity: warning
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: platform-observability
    runbook: docs/alerts.md#alert-1-high-latency
  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2 for 5m
    type: symptom-based
    owner: platform-observability
    runbook: docs/alerts.md#alert-2-high-error-rate
  - name: low_quality_score
    severity: warning
    condition: quality_score_avg < 0.75 for 10m
    type: symptom-based
    owner: ai-application
    runbook: docs/alerts.md#alert-3-low-quality-score
